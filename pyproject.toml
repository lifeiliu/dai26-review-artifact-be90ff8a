[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "revocation-propagation"
version = "0.1.0"
description = "Paper B prototype for suppression-resilient revocation propagation over federated agent delegation DAGs."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "certifi>=2025.8",
  "cryptography>=42",
  "langgraph>=1.2",
  "mcp>=1.27",
  "psycopg[binary]>=3.2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
revprop-experiments = "revocation_propagation.experiment_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
